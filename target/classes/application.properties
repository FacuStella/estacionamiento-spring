# Configuraci\u00f3n del Servidor y Puerto
server.port=8082

# Configuraci\u00f3n de Conexi\u00f3n a MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/estacionamiento_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true

# Usuario y Contrase\u00f1a de MySQL Workbench 
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Driver de MySQL
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuraci\u00f3n de JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.thymeleaf.check-template-location=false

# JWT: en produccion definir la variable de entorno JWT_SECRET (minimo 32 caracteres)
app.jwt.secret=${JWT_SECRET:clave-secreta-solo-para-desarrollo-cambiar-en-produccion-123456}
app.jwt.expiration-minutes=120

# Administrador inicial (se crea una sola vez si no existe ningun administrador). CAMBIAR la contrasena.
app.admin.username=admin
app.admin.password=Admin1234
# Mail del administrador inicial (opcional) y si tiene que cambiar la clave en su primer login
app.admin.mail=
app.admin.debe-cambiar-clave=true

# Descuento (%) para los vehiculos de socios cuando estacionan por hora
app.descuento-socio-porcentaje=20

